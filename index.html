<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Year's Eve Countdown</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  overflow: hidden;
  color: #fff;

  background:
    radial-gradient(
      circle at 50% 15%,
      rgba(75, 85, 120, 0.45),
      transparent 35%
    ),
    linear-gradient(
      145deg,
      #07090f 0%,
      #111522 55%,
      #05070b 100%
    );
}

.wrap {
  width: min(1100px, 92vw);
  text-align: center;
  padding: 56px 20px;
}

.eyebrow {
  font-size: clamp(12px, 1.5vw, 16px);
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: #aeb8cc;
  margin-bottom: 18px;
}

h1 {
  margin: 0 0 12px;
  font-size: clamp(34px, 7vw, 82px);
  line-height: 0.95;
  letter-spacing: -0.055em;
}

.sub {
  margin: 0 auto 44px;
  color: #9da8bd;
  font-size: clamp(14px, 2vw, 19px);
}

.timer {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}

.card {
  padding: 28px 12px 24px;

  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 24px;

  background: rgba(255, 255, 255, 0.055);

  box-shadow:
    0 24px 70px rgba(0, 0, 0, 0.3);

  backdrop-filter: blur(12px);
}

.num {
  font-variant-numeric: tabular-nums;
  font-size: clamp(48px, 9vw, 108px);
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.06em;
}

.label {
  margin-top: 12px;
  color: #8f9ab0;
  font-size: 12px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.footer {
  margin-top: 32px;
  color: #707b91;
  font-size: 13px;
}

@media (max-width: 650px) {
  .timer {
    grid-template-columns: repeat(2, 1fr);
  }

  .card {
    padding: 24px 8px;
  }

  .wrap {
    padding: 35px 10px;
  }
}
</style>
</head>

<body>

<main class="wrap">

  <div class="eyebrow">
    New Year's Eve
  </div>

  <h1 id="title">
    Counting down to 2027
  </h1>

  <p class="sub">
    Until the clock strikes midnight.
  </p>

  <section
    class="timer"
    aria-label="Countdown"
  >

    <div class="card">
      <div class="num" id="days">00</div>
      <div class="label">Days</div>
    </div>

    <div class="card">
      <div class="num" id="hours">00</div>
      <div class="label">Hours</div>
    </div>

    <div class="card">
      <div class="num" id="minutes">00</div>
      <div class="label">Minutes</div>
    </div>

    <div class="card">
      <div class="num" id="seconds">00</div>
      <div class="label">Seconds</div>
    </div>

  </section>

  <div class="footer" id="zone"></div>

</main>


<script>

const $ = id => document.getElementById(id);

const pad = n =>
  String(n).padStart(2, '0');


function target() {

  const now = new Date();

  return new Date(
    now.getFullYear() + 1,
    0,
    1,
    0,
    0,
    0,
    0
  );

}


let end = target();


function tick() {

  const now = new Date();

  if (now >= end) {
    end = target();
  }

  let s = Math.max(
    0,
    Math.floor((end - now) / 1000)
  );


  const d = Math.floor(s / 86400);

  s %= 86400;


  const h = Math.floor(s / 3600);

  s %= 3600;


  const m = Math.floor(s / 60);

  s %= 60;


  $('days').textContent =
    pad(d);

  $('hours').textContent =
    pad(h);

  $('minutes').textContent =
    pad(m);

  $('seconds').textContent =
    pad(s);


  $('title').textContent =
    'Counting down to ' +
    end.getFullYear();


  $('zone').textContent =
    'Your local time · ' +
    Intl.DateTimeFormat()
      .resolvedOptions()
      .timeZone;

}


tick();

setInterval(
  tick,
  250
);

</script>

</body>
</html>
